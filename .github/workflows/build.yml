name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Fetch hand-tracking model
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show errors on the run page
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "^e: |What went wrong|error:" -A3 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: " build.log | head -30 | while read -r line; do echo "::error::$line"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JarvisControl-build
          path: |
            build.log
            app/build/outputs/apk/debug/*.apk
