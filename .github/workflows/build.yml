name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show Kotlin errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e: ' build.log | head -30 | sed 's/^/::error::/' || true

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
