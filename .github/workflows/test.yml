name: Phone unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests
        # Runs the JVM tests in app/src/test. Does not need the hand-tracking model, so it stays quick.
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log
      - name: Show failures on the run page
        if: failure()
        run: |
          {
            echo "## Unit test failures"
            echo '```'
            grep -E "FAILED|AssertionError|What went wrong|Exception" -A3 test.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: |
            test.log
            app/build/reports/tests/
